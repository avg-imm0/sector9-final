<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="beamWide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff6e2" stop-opacity="0.42"/>
      <stop offset="0.35" stop-color="#fff0d4" stop-opacity="0.2"/>
      <stop offset="0.75" stop-color="#e8f2ff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#e8f2ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamCore" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffdf2" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#fff6df" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#fff6df" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffdf0" stop-opacity="0.72"/>
      <stop offset="0.35" stop-color="#fff2d8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#fff2d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dust" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff8e8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff8e8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Wide soft cone with a brighter core -->
  <polygon points="256,256 512,96 512,416" fill="url(#beamWide)"/>
  <polygon points="256,256 512,152 512,360" fill="url(#beamCore)"/>
  <polygon points="256,256 480,190 480,322" fill="url(#beamCore)" opacity="0.7"/>

  <!-- Dust motes catching the light -->
  <g fill="url(#dust)">
    <circle cx="330" cy="206" r="3.2"/><circle cx="372" cy="248" r="2.4"/>
    <circle cx="410" cy="192" r="3.8"/><circle cx="446" cy="276" r="2.8"/>
    <circle cx="352" cy="296" r="2.2"/><circle cx="396" cy="318" r="3.4"/>
    <circle cx="468" cy="228" r="2.6"/><circle cx="428" cy="332" r="3.0"/>
    <circle cx="308" cy="238" r="2.0"/><circle cx="462" cy="352" r="2.2"/>
  </g>

  <!-- Lamp core -->
  <circle cx="256" cy="256" r="70" fill="url(#halo)"/>
</svg>
