<svg xmlns="http://www.w3.org/2000/svg" width="64" height="96" viewBox="0 0 64 96">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#3a3e3c"/>
      <stop offset="0.5" stop-color="#242827"/>
      <stop offset="1" stop-color="#151918"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a24" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#5a3215" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="3" y="1" width="58" height="94" rx="2" fill="#040608"/>
  <rect x="6" y="4" width="52" height="88" fill="url(#steel)"/>
  <rect x="9" y="8" width="46" height="80" fill="#202423"/>

  <!-- Panel seams with light edges -->
  <rect x="12" y="23" width="40" height="2" fill="#121514"/>
  <rect x="12" y="25" width="40" height="0.6" fill="#5b625e" opacity="0.4"/>
  <rect x="12" y="41" width="40" height="2" fill="#121514"/>
  <rect x="12" y="43" width="40" height="0.6" fill="#5b625e" opacity="0.4"/>
  <rect x="12" y="59" width="40" height="2" fill="#121514"/>
  <rect x="12" y="61" width="40" height="0.6" fill="#5b625e" opacity="0.4"/>

  <!-- Upper inset panel -->
  <rect x="12" y="10" width="40" height="11" fill="#2d3230"/>
  <rect x="13" y="11" width="38" height="9" fill="none" stroke="#0d100f" stroke-width="1"/>

  <!-- Scratches and worn paint -->
  <g stroke="#6e7772" stroke-width="0.6" fill="none" opacity="0.45">
    <path d="M14 30 L26 29 M32 48 L50 47 M15 66 L28 65 M40 68 L52 66"/>
    <path d="M18 14 L30 13 M36 16 L50 15"/>
  </g>
  <g stroke="#0a0d0c" stroke-width="0.8" fill="none" opacity="0.7">
    <path d="M15 32 L27 31 M33 50 L49 49 M16 68 L28 67"/>
  </g>

  <!-- Rust streaks from hinges -->
  <rect x="10" y="12" width="4" height="30" fill="url(#rust)"/>
  <rect x="50" y="56" width="4" height="26" fill="url(#rust)"/>
  <ellipse cx="12" cy="42" rx="4" ry="7" fill="#6a3d18" opacity="0.3"/>
  <ellipse cx="52" cy="82" rx="4" ry="6" fill="#6a3d18" opacity="0.28"/>

  <!-- Ventilation slots near the bottom -->
  <g fill="#0b0e0d">
    <rect x="15" y="70" width="6" height="3"/><rect x="23" y="70" width="6" height="3"/>
    <rect x="31" y="70" width="6" height="3"/><rect x="39" y="70" width="6" height="3"/>
    <rect x="15" y="75" width="6" height="3"/><rect x="23" y="75" width="6" height="3"/>
    <rect x="31" y="75" width="6" height="3"/><rect x="39" y="75" width="6" height="3"/>
  </g>
  <g fill="#6b736e" opacity="0.35">
    <rect x="15" y="70" width="6" height="0.5"/><rect x="23" y="70" width="6" height="0.5"/>
    <rect x="31" y="70" width="6" height="0.5"/><rect x="39" y="70" width="6" height="0.5"/>
  </g>

  <!-- Handle with plate -->
  <rect x="46" y="45" width="7" height="12" rx="1" fill="#0b0e0d"/>
  <rect x="47" y="46" width="5" height="10" rx="1" fill="#8d928c"/>
  <rect x="48" y="47" width="2" height="8" fill="#c3c7bf" opacity="0.6"/>
  <circle cx="49.5" cy="51" r="1" fill="#2a2e2b"/>

  <!-- Hinges and bolts -->
  <g fill="#0f1211" stroke="#5c645f" stroke-width="0.5">
    <circle cx="12" cy="12" r="2"/><circle cx="12" cy="84" r="2"/>
    <circle cx="52" cy="12" r="2"/><circle cx="52" cy="84" r="2"/>
  </g>

  <!-- Wet grime at the bottom -->
  <rect x="9" y="84" width="46" height="4" fill="#070a09" opacity="0.6"/>

  <rect x="6" y="4" width="52" height="88" fill="none" stroke="#080a09" stroke-width="2"/>
</svg>
